name: NodeApp Deployment

on:
  push:
    branches:
      - main
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Deploy Via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: sir
          key: ${{ secrets.SSH_KEY }}
          port: 2222
          script: |
            git clone https://github.com/jayvaghela1209/nodeapp.git
            cd /home/jay-vaghela/nodeapp
            git pull 
            docker compose up -d --build
