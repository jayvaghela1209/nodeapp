name: NodeApp Deployment

on:
  push:
    branches:
      - main
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Deploy Via SSH
        uses: appleboy/ssh@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: sir
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/sir
            git pull 
            docker compose build -d --build
